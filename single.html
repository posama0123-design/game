<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<script>
  // 1. シーン・カメラ・レンダラーの基本セットアップ
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050508); // 暗い夜・洞窟風の背景
  scene.fog = new THREE.FogExp2(0x050508, 0.05);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 3); // プレイヤー目線

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; // 影の有効化
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // 2. 環境光（全体をかすかに照らす暗めの光）
  const ambientLight = new THREE.AmbientLight(0x222233, 0.3);
  scene.add(ambientLight);

  // 衝突判定対象のオブジェクトリスト
  const collidableObjects = [];

  // 3. テクスチャの読み込みとドット絵向け設定
  const textureLoader = new THREE.TextureLoader();
  
  // ※ 画像ファイル 'torch.png' が同フォルダに必要です（未指定時はプレースホルダー描画になります）
  const torchTexture = textureLoader.load('torch.png', undefined, undefined, () => {
    // 画像がない場合のフォールバック（動作確認用キャンバステクスチャ生成）
    const canvas = document.createElement('canvas');
    canvas.width = 16;
    canvas.height = 16;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(4, 0, 8, 6);
    torchTexture.image = canvas;
    torchTexture.needsUpdate = true;
  });

  // ドット絵感を維持するピクセルフィルタリング設定
  torchTexture.magFilter = THREE.NearestFilter;
  torchTexture.minFilter = THREE.NearestFilter;

  // 4. 床（環境確認用）
  const floorGeometry = new THREE.PlaneGeometry(20, 20);
  const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // 5. 松明（Torch）オブジェクトの構築
  const torchGroup = new THREE.Group();

  // 松明の持ち手・本体のメッシュ
  const torchGeometry = new THREE.BoxGeometry(0.15, 0.6, 0.15);
  const torchMaterial = new THREE.MeshStandardMaterial({
    map: torchTexture,
    transparent: true,
    alphaTest: 0.5 // 透過PNGの境界のチラつきを防止
  });
  const torchMesh = new THREE.Mesh(torchGeometry, torchMaterial);
  torchMesh.position.y = 0.3; // 底面を原点に合わせる
  torchMesh.castShadow = true;
  torchGroup.add(torchMesh);

  // 6. 光（PointLight）の設定
  // 明るさ(2)、届く距離(8)、減衰(2)でまぶしすぎない自然な暖色光に
  const torchLight = new THREE.PointLight(0xffaa33, 2, 8, 2);
  torchLight.position.set(0, 0.55, 0); // 松明の先端付近に配置
  torchLight.castShadow = true;
  torchLight.shadow.mapSize.width = 512;
  torchLight.shadow.mapSize.height = 512;
  torchGroup.add(torchLight);

  // 松明を配置（例：原点に設置）
  torchGroup.position.set(0, 0, 0);
  scene.add(torchGroup);

  // 7. ブロック判定（衝突判定リストに追加）
  // プレイヤー移動処理側の Raycaster や AABB 判定で参照する配列に追加
  torchGroup.name = "TorchBlock";
  collidableObjects.push(torchGroup);

  // 8. アニメーションループ（炎のゆらめき演出付き）
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);

    time += 0.05;
    // 点光源の強さをわずかにランダム変動させて炎のゆらめきを表現
    torchLight.intensity = 2 + Math.sin(time * 3) * 0.15 + (Math.random() - 0.5) * 0.1;

    renderer.render(scene, camera);
  }

  animate();

  // 9. ウィンドウサイズ変更対応
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
