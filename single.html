<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Style Torch System</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      margin: -5px 0 0 -5px;
      color: white; font-size: 20px;
      user-select: none; pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="crosshair">+</div>
<script>
  // 1. シーン・カメラ・レンダラー setup
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050814); // 暗い夜の空
  scene.fog = new THREE.FogExp2(0x050814, 0.03);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: false }); // ドット絵感を損なわないようアンチエイリアスOFF
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap; // マイクラ風のパキッとした影
  document.body.appendChild(renderer.domElement);

  // 2. テクスチャ設定（ドット絵用 NearestFilter）
  const textureLoader = new THREE.TextureLoader();
  
  // 仮のキャンバステクスチャ（16x16）でマイクラ風松明を描画
  const createTorchTexture = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 16; canvas.height = 16;
    const ctx = canvas.getContext('2d');
    
    // 木の柄の部分
    ctx.fillStyle = '#5c4033';
    ctx.fillRect(7, 4, 2, 10);
    ctx.fillStyle = '#3d281e';
    ctx.fillRect(8, 4, 1, 10);

    // 炎・石炭部分
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(6, 2, 4, 3);
    ctx.fillStyle = '#ffff55';
    ctx.fillRect(7, 3, 2, 2);

    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
  };

  const torchTexture = createTorchTexture();

  // 3. 環境光（月光）
  const ambientLight = new THREE.AmbientLight(0x223355, 0.2);
  scene.add(ambientLight);

  // ブロック判定（衝突判定）用配列
  const worldBlocks = [];

  // --- 4. 松明（Torch）ブロックの生成関数 ---
  function createTorchBlock(x, y, z) {
    const torchGroup = new THREE.Group();
    torchGroup.position.set(x, y, z);

    // 【見た目】マイクラ風の細い松明メッシュ (2/16 x 10/16 x 2/16 ブロックサイズ)
    const torchGeo = new THREE.BoxGeometry(2/16, 10/16, 2/16);
    const torchMat = new THREE.MeshStandardMaterial({
      map: torchTexture,
      transparent: true,
      alphaTest: 0.5,
      roughness: 0.9
    });
    const torchMesh = new THREE.Mesh(torchGeo, torchMat);
    torchMesh.position.set(0, (10/16)/2, 0); // 底面をブロックの床に合わせる
    torchMesh.castShadow = true;
    torchGroup.add(torchMesh);

    // 【光】マイクラのレベル14相当の暖色光源
    // (色, 強度: 2.5, 届く距離: 14ブロック, 減衰: 1.5)
    const torchLight = new THREE.PointLight(0xff9933, 2.5, 14, 1.5);
    torchLight.position.set(0, 0.6, 0); // 炎の位置
    torchLight.castShadow = true;
    torchLight.shadow.mapSize.width = 512;
    torchLight.shadow.mapSize.height = 512;
    torchGroup.add(torchLight);

    // 【衝突判定】マイクラ仕様：松明自体も1x1x1のフルブロック領域として判定、または見えないAABBを設置
    // ここではプレイヤーが通り抜けられない1ブロック分の透明HitBoxを設定
    const boundingGeo = new THREE.BoxGeometry(1, 1, 1);
    const boundingMat = new THREE.MeshBasicMaterial({ visible: false }); // 非表示の判定用ブロック
    const hitBox = new THREE.Mesh(boundingGeo, boundingMat);
    hitBox.position.set(0, 0.5, 0);
    torchGroup.add(hitBox);

    scene.add(torchGroup);

    // 衝突判定リストに登録
    worldBlocks.push(hitBox);

    return { group: torchGroup, light: torchLight };
  }

  // --- 5. 地面と障害物ブロックの設置 ---
  // 床ブロック
  const floorGeo = new THREE.BoxGeometry(20, 1, 20);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x557733, roughness: 1.0 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.position.set(0, -0.5, 0);
  floor.receiveShadow = true;
  scene.add(floor);
  worldBlocks.push(floor);

  // 設置サンプル：松明をグリッドに沿って配置 (x:0, y:0, z:0)
  const torch1 = createTorchBlock(0, 0, 0);
  const torch2 = createTorchBlock(3, 0, -2);

  // 6. プレイヤー（カメラ）の位置調整
  camera.position.set(0, 1.6, 5);

  // 7. アニメーション（マイクラ風の微妙な光のゆらめき）
  let clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const elapsedTime = clock.getElapsedTime();
    
    // 松明の光をわずかにランダム明滅（マイクラの炎の揺らぎ）
    const flicker1 = Math.sin(elapsedTime * 10) * 0.1 + (Math.random() - 0.5) * 0.05;
    torch1.light.intensity = 2.5 + flicker1;

    const flicker2 = Math.cos(elapsedTime * 12) * 0.1 + (Math.random() - 0.5) * 0.05;
    torch2.light.intensity = 2.5 + flicker2;

    renderer.render(scene, camera);
  }

  animate();

  // 8. リサイズ処理
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
