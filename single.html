<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シングルプレイ - Minecraft Web Edition</title>
    <!-- ピクセルフォント -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* 土ブロック風の背景 */
            background-color: #79553a;
            background-image: 
                repeating-linear-gradient(45deg, #6c4b33 25%, transparent 25%, transparent 75%, #6c4b33 75%, #6c4b33), 
                repeating-linear-gradient(45deg, #6c4b33 25%, #79553a 25%, #79553a 75%, #6c4b33 75%, #6c4b33);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            font-family: 'DotGothic16', sans-serif;
            color: white;
            user-select: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding-top: 50px;
        }

        .active {
            display: flex;
        }

        h2 {
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .menu-container {
            width: 500px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        button {
            background-color: #c6c6c6;
            border: 2px solid #000;
            border-top-color: #fff;
            border-left-color: #fff;
            border-bottom-color: #555;
            border-right-color: #555;
            color: #333;
            font-family: 'DotGothic16', sans-serif;
            font-size: 18px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            text-shadow: 1px 1px 0px #fff;
            transition: 0.1s;
        }

        button:hover {
            background-color: #a0a0ff;
            color: #fff;
            text-shadow: 1px 1px 0px #3f3f3f;
            border-top-color: #d6d6ff;
            border-left-color: #d6d6ff;
            border-bottom-color: #5555aa;
            border-right-color: #5555aa;
        }

        button:disabled {
            background-color: #555;
            color: #888;
            text-shadow: none;
            cursor: not-allowed;
            border-color: #333;
        }

        .half-btn {
            width: 48%;
        }

        /* ワールドリストのスタイル */
        .world-list-container {
            width: 500px;
            height: 300px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #000;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
        }

        .world-item {
            border: 2px solid #555;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .world-item:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }

        .world-info {
            display: flex;
            flex-direction: column;
        }

        .world-name {
            font-size: 20px;
            color: #ffff55;
            text-shadow: 2px 2px 0px #000;
        }

        .world-mode {
            font-size: 14px;
            color: #aaa;
        }

        .delete-btn {
            width: 60px;
            padding: 5px;
            font-size: 14px;
            background-color: #aa0000;
            color: white;
            text-shadow: none;
        }
        .delete-btn:hover {
            background-color: #ff5555;
        }

        /* 入力フォーム */
        .input-group {
            margin-bottom: 20px;
            width: 500px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #000;
            color: #fff;
            border: 2px solid #a0a0a0;
            font-family: 'DotGothic16', sans-serif;
            font-size: 18px;
            box-sizing: border-box;
        }
        
        .limit-text {
            color: #ff5555;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

    <!-- ワールド選択画面 -->
    <div id="select-screen" class="screen active">
        <h2>ワールドを選択</h2>
        
        <div class="world-list-container" id="world-list">
            <!-- ここにJSでワールドが追加されます -->
        </div>

        <div id="limit-warning" class="limit-text" style="display: none;">
            ワールドは最大3個までです。新しく作る場合はどれかを削除してください。
        </div>

        <div class="menu-container">
            <button id="btn-create-new" onclick="showCreateScreen()">ワールド新規作成</button>
            <button onclick="window.location.href='index.html'" style="margin-top: 10px;">タイトル画面へ戻る</button>
        </div>
    </div>

    <!-- ワールド新規作成画面 -->
    <div id="create-screen" class="screen">
        <h2>ワールド新規作成</h2>
        
        <div class="input-group">
            <label style="display:block; margin-bottom:5px; text-shadow:2px 2px 0px #000;">ワールド名</label>
            <input type="text" id="new-world-name" value="新規ワールド">
        </div>

        <div class="menu-container">
            <!-- モード切替ボタン -->
            <button id="btn-toggle-mode" onclick="toggleMode()" style="margin-bottom: 20px;">ゲームモード: サバイバル</button>
            
            <div class="row">
                <button class="half-btn" onclick="createNewWorld()">ワールド作成</button>
                <button class="half-btn" onclick="showSelectScreen()">キャンセル</button>
            </div>
        </div>
    </div>

    <script>
        // --- データ管理 ---
        const MAX_WORLDS = 3;
        let worlds = [];
        let currentSelectedMode = 'survival'; // 'survival' か 'creative'

        // 初期読み込み
        window.onload = () => {
            loadWorlds();
            renderWorldList();
        };

        // ローカルストレージからワールドデータを読み込む
        function loadWorlds() {
            const savedData = localStorage.getItem('mc_worlds');
            if (savedData) {
                worlds = JSON.parse(savedData);
            }
        }

        // ローカルストレージに保存
        function saveWorlds() {
            localStorage.setItem('mc_worlds', JSON.stringify(worlds));
        }

        // --- 画面切り替え ---
        function showSelectScreen() {
            document.getElementById('create-screen').classList.remove('active');
            document.getElementById('select-screen').classList.add('active');
            renderWorldList(); // 戻った時にリストを再描画
        }

        function showCreateScreen() {
            if (worlds.length >= MAX_WORLDS) return;
            // 初期化
            document.getElementById('new-world-name').value = "新規ワールド";
            currentSelectedMode = 'survival';
            updateModeButtonText();
            
            document.getElementById('select-screen').classList.remove('active');
            document.getElementById('create-screen').classList.add('active');
        }

        // --- 描画ロジック ---
        function renderWorldList() {
            const listContainer = document.getElementById('world-list');
            listContainer.innerHTML = '';

            if (worlds.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:100px;">ワールドがありません</p>';
            } else {
                worlds.forEach((world, index) => {
                    const modeText = world.mode === 'survival' ? 'サバイバルモード' : 'クリエイティブモード';
                    
                    const item = document.createElement('div');
                    item.className = 'world-item';
                    item.onclick = () => playWorld(index);
                    item.innerHTML = `
                        <div class="world-info">
                            <span class="world-name">${world.name}</span>
                            <span class="world-mode">${modeText}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteWorld(${index}, event)">削除</button>
                    `;
                    listContainer.appendChild(item);
                });
            }

            // 3個制限のチェック
            const btnCreate = document.getElementById('btn-create-new');
            const warning = document.getElementById('limit-warning');
            if (worlds.length >= MAX_WORLDS) {
                btnCreate.disabled = true;
                warning.style.display = 'block';
            } else {
                btnCreate.disabled = false;
                warning.style.display = 'none';
            }
        }

        // --- ワールド作成・削除・プレイ ---
        function toggleMode() {
            currentSelectedMode = currentSelectedMode === 'survival' ? 'creative' : 'survival';
            updateModeButtonText();
        }

        function updateModeButtonText() {
            const btn = document.getElementById('btn-toggle-mode');
            if (currentSelectedMode === 'survival') {
                btn.innerText = "ゲームモード: サバイバル";
            } else {
                btn.innerText = "ゲームモード: クリエイティブ";
            }
        }

        function createNewWorld() {
            if (worlds.length >= MAX_WORLDS) return;

            let name = document.getElementById('new-world-name').value.trim();
            if (name === "") name = "名もなきワールド";

            const newWorld = {
                id: Date.now(), // 一意のIDとして現在時刻を使用
                name: name,
                mode: currentSelectedMode
            };

            worlds.push(newWorld);
            saveWorlds();
            showSelectScreen();
        }

        function deleteWorld(index, event) {
            // 親要素(world-item)のクリックイベント(playWorld)が発火しないように止める
            event.stopPropagation();
            
            if (confirm(`「${worlds[index].name}」を本当に削除しますか？\n(この操作は元に戻せません)`)) {
                worlds.splice(index, 1);
                saveWorlds();
                renderWorldList();
            }
        }

        function playWorld(index) {
            const world = worlds[index];
            // URLパラメータを使って splay.html にデータを引き継ぐ
            const url = `splay.html?id=${world.id}&name=${encodeURIComponent(world.name)}&mode=${world.mode}`;
            window.location.href = url;
        }
    </script>
</body>
</html>
